name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで新しい push があれば、進行中の実行をキャンセルして無駄を減らす
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # packageManager フィールド（pnpm@10.4.1）から pnpm を用意する
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 依存をインストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm check

      - name: Unit テスト
        run: pnpm test

      - name: ビルド
        run: pnpm build
