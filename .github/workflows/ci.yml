name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI は読み取りのみで完結するため、GITHUB_TOKEN を最小権限（読み取り）に固定する
permissions:
  contents: read

# 同じブランチで新しい push があれば、進行中の実行をキャンセルして無駄を減らす
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # チェックアウト後に認証情報を Git へ残さない（後続ステップでの再利用を防ぐ）
          persist-credentials: false

      # packageManager フィールド（pnpm@10.4.1）から pnpm を用意する
      - uses: pnpm/action-setup@v6

      # Node 20 は 2026-04-30 に EOL のため、サポート中の LTS（22）を使う
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 依存をインストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm check

      - name: Unit テスト
        run: pnpm test

      - name: ビルド
        run: pnpm build
