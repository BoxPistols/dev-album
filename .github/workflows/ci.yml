name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI は読み取りのみで完結するため、GITHUB_TOKEN を最小権限（読み取り）に固定する
permissions:
  contents: read

# 同じブランチで新しい push があれば、進行中の実行をキャンセルして無駄を減らす
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # チェックアウト後に認証情報を Git へ残さない（後続ステップでの再利用を防ぐ）
          persist-credentials: false

      # packageManager フィールド（pnpm@10.4.1）から pnpm を用意する
      - uses: pnpm/action-setup@v6

      # 本番の Vercel が Node 24.x で動いているので、CI も 24 に揃える。
      # テストする実行環境と動く実行環境がずれると、CI で落ちるのに本番では動く
      # （またはその逆）が検出できない。Vercel の Node を上げるときはここも一緒に上げる。
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 依存をインストール
        run: pnpm install --frozen-lockfile

      - name: 型チェック
        run: pnpm check

      - name: Unit テスト
        run: pnpm test

      - name: ビルド
        run: pnpm build

      # Storybook は本体のビルドとは別の解決経路（.storybook/main.ts の alias、
      # stories の glob、framework preset）を通るため、pnpm build が通っても壊れうる。
      # 実際に main.ts の alias が別リポジトリの絶対パスのまま放置され、
      # 誰も気づかない期間があった。実測で数秒なので PR ゲートに入れる。
      - name: Storybook ビルド
        run: pnpm build-storybook

  # E2E 回帰ガード（a11y を含む全スペック）。
  # a11y: axe-core で Light / Dark / Dracula の3テーマを検査し、critical / serious な
  # 違反（コントラスト等）をブロックする。検査対象にはコードブロック（テンプレート
  # リテラルの補間トークン）を含むページも入れ、シンタックス色・primary 色の退行を捕捉する。
  # その他: プレビュー基盤（実ライブラリ描画・エラー不変条件）、Three.js、マニュアル導線。
  # 「ビルドが通る ≠ 正しく描画される」ため、実描画での検証を型/単体と別ジョブで回す。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 依存をインストール
        run: pnpm install --frozen-lockfile

      # Playwright のブラウザ本体と OS 依存を用意する（chromium のみ）
      - name: Playwright ブラウザを準備
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config の webServer が dev サーバを自動起動して検査する
      - name: E2E 検査（a11y 3テーマ含む全スペック）
        run: pnpm test:e2e

      # 失敗時のみレポートを残す（CI 固有の失敗をローカルで追跡できるようにする）
      - name: Playwright レポートを保存
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
