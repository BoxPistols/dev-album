version: 2
updates:
  # npm / pnpm 依存の更新
  #
  # 関連する依存はグループにまとめ、1本のPRで上げる。理由は2つ。
  # 1. 版を揃えないと動かない組がある。playwrightと@playwright/testが別のPRで上がり、
  #    片方だけ新しい状態で「No tests found」になってCIが落ちた（#196・#197）
  # 2. PRごとにロックファイルを作り直すので、続けてマージすると後のPRのロックファイルが
  #    古い前提のまま入る。2026-11-13にviteを8系へ上げるPRの直後に別のPRをマージし、
  #    vitestがvite 7系を参照したままの壊れたロックファイルがmainに入った。
  #    mainのCIとVercelの本番デプロイが1週間落ち続けた
  # メジャー更新は挙動が変わりうるので、グループに入れず1件ずつ見る。
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      # 版を揃えないと動かない組（メジャー更新も含めて一緒に上げる）
      playwright:
        patterns:
          - 'playwright'
          - '@playwright/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      storybook:
        patterns:
          - 'storybook'
          - '@storybook/*'
      # 残りのマイナー・パッチ更新は1本にまとめる
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # TypeScript 7.0 はネイティブ(Go)版プレビューで既存ツールチェインと非互換 → 5.x に固定
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # GitHub Actions 自身のバージョン更新
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns:
          - '*'
