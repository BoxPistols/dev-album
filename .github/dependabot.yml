version: 2
updates:
  # npm / pnpm 依存の更新
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      # TypeScript 7.0 はネイティブ(Go)版プレビューで既存ツールチェインと非互換 → 5.x に固定
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # GitHub Actions 自身のバージョン更新
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'ci'
    commit-message:
      prefix: 'chore(ci)'
