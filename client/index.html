<!doctype html>
<html lang="ja">

  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale は付けない。ピンチズームを止めると WCAG 1.4.4 を満たせない -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <title>Dev Album (beta) | Web 開発の実践リファレンス</title>
    <meta
      name="description"
      content="Git・React・Claude Code・Three.js から AI・ML、UX デザイン、API 設計、Vue / Nuxt、インフラ、開発フローまでを、Web 標準とアクセシビリティの観点を含めて解説する技術マニュアル。"
    />

    <link rel="canonical" href="https://dev-album.vercel.app/" />
    <meta name="robots" content="index, follow" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Favicon / PWA -->
    <!-- ブラウザはファビコンを URL 単位で強く握るため、同じパスに置き換えても
         古いものが残る（Service Worker の precache にも入る）。図柄を変えたら
         v を上げて別 URL にする。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png?v=2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- apple- 付きは非推奨だが、古い iOS 向けに残す -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Theme Color: index.css の --primary と vite.config.ts の manifest.theme_color と
         同じ値にする。3 か所のどれかだけ変えるとブラウザ UI だけ旧色のまま残る -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1F5CDB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090B" />

    <!-- OGP / SNS -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dev Album" />
    <meta property="og:title" content="Dev Album — Web 開発の実践リファレンス" />
    <meta
      property="og:description"
      content="Git・React・Claude Code・Three.js から AI・ML、UX デザイン、API 設計、Vue / Nuxt、インフラ、開発フローまで。Web 標準とアクセシビリティの観点を含めて解説する技術マニュアル。"
    />
    <meta property="og:url" content="https://dev-album.vercel.app/" />
    <meta property="og:image" content="https://dev-album.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dev Album — Web 開発の実践リファレンス" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dev Album — Web 開発の実践リファレンス" />
    <meta
      name="twitter:description"
      content="Git・React・Claude Code・Three.js から AI・ML、UX デザイン、API 設計、Vue / Nuxt、インフラ、開発フローまで。Web 標準とアクセシビリティの観点を含めて解説する技術マニュアル。"
    />
    <meta name="twitter:image" content="https://dev-album.vercel.app/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
